{% set name = "pentapy" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0aaf20492c6da885fe43b35ae54a968f3d239249f3cf492541f685ca39419438

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools >=64
    - setuptools_scm >=7
    - cython >=3.0
    - numpy
  run:
    - python
    - numpy >=1.20.0

test:
  imports:
    - pentapy
  requires:
    - pytest
  source_files:
    - tests
  commands:
    - pytest -vv tests

about:
  home: https://github.com/GeoStat-Framework/pentapy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'pentapy: A toolbox for pentadiagonal matrizes.'
  doc_url: https://pentapy.readthedocs.io/
  dev_url: https://github.com/GeoStat-Framework/pentapy

extra:
  recipe-maintainers:
    - MuellerSeb
